// ======================================================
// Basic Points Stats - Archivo de Configuración Oficial
// Ubicación: cstrike/addons/amxmodx/configs/BasicPointsStats.cfg
// ======================================================

// ------------------------------------------------------
// 1. Configuración de Conexión MySQL / MariaDB (OBLIGATORIO)
// ATENCIÓN: El plugin NO iniciará si estas credenciales no han sido configuradas.
// Seguridad: Usa un usuario MySQL exclusivo con permisos mínimos (SELECT, INSERT, UPDATE) sobre esta BD.
// ------------------------------------------------------
bps_sql_host "127.0.0.1:3306"
bps_sql_user "tu_usuario_db"
bps_sql_pass "tu_contrasena_db"
bps_sql_db "basicpointsstats"

// ------------------------------------------------------
// 2. Nombres de Tablas de la Base de Datos
// ------------------------------------------------------
bps_sql_db_1 "basicpointsstats"
bps_sql_db_2 "basicweapomstats1"
bps_sql_db_3 "basicweapomstats2"
bps_sql_db_4 "basicversusstats"

// ------------------------------------------------------
// 3. Compatibilidad de Guardado (SteamID / Nombre) y Nombres
// ------------------------------------------------------
// Modo de guardado e identificación de estadísticas:
//   "0" = Desactivado (no carga ni guarda estadísticas en SQL)
//   "1" = Por SteamID (authid) [RECOMENDADO: evita suplantación de identidad]
//   "2" = Por Nombre (nick, máximo 12 letras)
bps_save_type "1"

// Longitud máxima permitida para los nombres en SQL, MOTD y Web (máximo 12 caracteres)
bps_name_max_len "12"

// Forzar también el recorte del nombre del jugador dentro del servidor al máximo configurado
// (0 = Solo recortar al guardar/mostrar estadísticas, 1 = Renombrar también dentro del servidor)
bps_enforce_name_len "0"

// ------------------------------------------------------
// 4. Configuración Multi-Server
// ------------------------------------------------------
// Identificador único de este servidor (solo letras, números, '_' o '-', máx. 16 caracteres)
// Ejemplo: "srv1", "pug1", "dust2", "publico"
bps_server_id "srv1"

// Nombre visible de este servidor en el Panel Web
bps_server_name "CS 1.6 Server #1"

// Modo Multi-Server:
//   "0" = Global Compartido (todos los servidores suman al mismo ranking usando incrementos atómicos SQL)
//   "1" = Por Servidor (cada bps_server_id mantiene sus estadísticas independientes en la misma BD)
bps_multi_server_mode "0"

// ------------------------------------------------------
// 5. Configuración General del Sistema de Puntos y Compatibilidad PUG
// ------------------------------------------------------
// Sincronización con el sistema PUG:
//   "2" = Automático (si detecta el sistema PUG registra solo en partida LIVE; si no hay PUG funciona siempre) [RECOMENDADO]
//   "1" = Forzar modo PUG (solo registra durante partida en vivo)
//   "0" = Servidor normal sin PUG (registra estadísticas continuamente mientras haya equipos válidos)
bps_pug_sync "2"

// Penalizar / Descontar puntos a jugadores que abandonen la partida en vivo (0 = Desactivado, 1 = Activado)
pug_leave_points "0"

// Habilitar / Deshabilitar el sistema completo de estadísticas (0 = Deshabilitado, 1 = Habilitado)
pug_stats_enable "1"

// Permitir registrar estadísticas jugando con BOTs (0 = No, 1 = Si)
pug_stats_bots "0"

// ------------------------------------------------------
// 6. Integración con el Panel Web (.top)
// ------------------------------------------------------
// URL para la consulta del Top15 / Ranking Web en ventana MOTD
pug_web_top_pug "http://127.0.0.1/web/top15.php"
